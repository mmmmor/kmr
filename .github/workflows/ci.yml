name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Usuario root del contenedor de abajo (solo existe en el runner). Los tests crean además un
      # usuario con el rol kmr_app y corren la API con él.
      MONGODB_URI_TEST: mongodb://root:root@localhost:27017/?directConnection=true&authSource=admin
    steps:
      - uses: actions/checkout@v7

      # Replica set de un nodo (las transacciones lo necesitan) y con autenticación (para que se
      # apliquen los permisos del rol kmr_app). Con autenticación, el replica set exige un keyFile,
      # por eso no se usa un service: el archivo tiene que existir antes de arrancar el contenedor.
      # 7.0 y no 8.x: mongod 8 no arranca en kernels Linux 6.19+ (SERVER-121912), que ya usan
      # algunos runners de GitHub. Atlas no se ve afectado. Volver a 8.x cuando salga la corrección.
      - name: Levantar MongoDB
        working-directory: .
        run: |
          openssl rand -base64 756 > mongo-keyfile
          chmod 400 mongo-keyfile
          sudo chown 999:999 mongo-keyfile
          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD=root \
            -v "$PWD/mongo-keyfile:/etc/mongo-keyfile:ro" \
            mongo:7.0 --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all
          for intento in $(seq 1 60); do
            if docker exec mongodb mongosh -u root -p root --quiet --eval \
              "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
            then
              exit 0
            fi
            sleep 2
          done
          docker logs mongodb
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        run: pytest

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
